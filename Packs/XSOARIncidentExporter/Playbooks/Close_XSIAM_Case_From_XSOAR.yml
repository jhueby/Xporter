id: close-xsiam-case-from-xsoar
version: -1
name: Close XSIAM Case From XSOAR
description: |-
  Runs on XSIAM when an alert from XSOAR is ingested.
  Extracts the Close Reason and Close Notes from the XSOAR incident data.
  If the XSOAR incident was closed, closes the XSIAM case with the same reason and notes.
  Attach this playbook to incidents with source "Palo Alto Networks - XSOAR".
